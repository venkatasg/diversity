[project]
name = "diversity"
version = "0.3.0"
description = "A Python toolkit for measuring diversity in text."
authors = [
    {name = "Chantal Shaib", email = "shaib.c@northeastern.edu"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "nltk>=3.8.1,<4",
    "rouge-score>=0.1.2,<0.2",
    "evaluate>=0.4.1,<0.5",
    "sentence-transformers>=5.1.0,<6",
    "transformers>=4.41.0,<5",
    "stanza>=1.9,<2",
    "mauve-text>=0.3.0,<0.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.4.0,<4",
    "pandas>=2.1.2,<3",
    "numpy>=1.26.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
